<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --black:#0b0b0c; --char:#1a1a1d;
    --gold:#c9972b; --gold2:#f4d47c; --golddeep:#9a6f12; --goldbg:#fbf3df;
    --bg:#f3f1ec; --card:#fff; --ink:#18181b; --muted:#6f6b63; --line:#e7e2d8;
    --ok:#178a55; --okbg:#e2f4ea; --go:#3f4a5a; --gobg:#eef0f3; --due:#b26b00; --duebg:#fdf0d8;
    --r:18px; --shadow:0 1px 2px rgba(20,16,8,.05),0 8px 24px rgba(20,16,8,.07);
    --goldgrad:linear-gradient(135deg,#f6dc8c 0%,#d9a93a 45%,#a87a17 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  svg{flex-shrink:0}
  button{font:inherit;cursor:pointer}

  /* ---------- Header ---------- */
  header{position:relative;overflow:hidden;color:#fff;padding:18px 20px 80px;
    background:radial-gradient(90% 120% at 100% 0%,rgba(217,169,58,.28) 0%,transparent 55%),
               radial-gradient(70% 90% at 0% 100%,rgba(217,169,58,.12) 0%,transparent 60%),var(--black)}
  .bar{display:flex;align-items:center;gap:12px}
  .logo{width:52px;height:52px;border-radius:50%;padding:2px;background:var(--goldgrad);box-shadow:0 0 18px rgba(217,169,58,.35)}
  .logo img{width:100%;height:100%;border-radius:50%;display:block}
  .wordmark{flex:1;line-height:1.15}
  .wordmark b{display:block;font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;
    background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wordmark span{font-size:10.5px;letter-spacing:.22em;color:#bdb6a6}
  .lang{display:flex;border:1px solid rgba(244,212,124,.45);border-radius:999px;padding:2px}
  .lang button{border:0;background:none;color:#cfc6b2;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .lang button.on{background:var(--goldgrad);color:var(--black)}
  .hello{margin:22px 0 2px;font-size:24px;font-weight:700;line-height:1.25}
  .sub{margin:0;font-size:14px;color:#bdb6a6}
  .route{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11.5px;font-weight:600;letter-spacing:.1em;color:#d8cfbb}
  .route .path{flex:1;position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px)}
  .route .path svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);color:var(--gold2);filter:drop-shadow(0 0 6px rgba(244,212,124,.8))}
  .route em{font-style:normal;color:var(--gold2)}

  main{position:relative;z-index:2;max-width:560px;margin:-58px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .muted{color:var(--muted);font-size:13.5px}
  .err{color:#c53030;font-size:14px;margin:6px 0 0}

  /* ---------- Section head ---------- */
  .sec-h{display:flex;align-items:center;gap:10px}
  .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--goldbg);color:var(--golddeep)}
  .sec-h b{flex:1;font-size:15px;line-height:1.3}
  .sec-h b small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .link{border:0;background:none;color:var(--golddeep);font-weight:600;font-size:14px;padding:6px 2px}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);padding:6px}
  .stat{border:0;background:none;color:inherit;padding:12px 4px 10px;border-radius:14px;text-align:center;transition:background .15s}
  .stat b{display:block;font-size:28px;line-height:1.1;font-weight:700}
  .stat span{font-size:12.5px;color:var(--muted);font-weight:500}
  .stat.due b{color:var(--due)} .stat.done b{color:var(--ok)}
  .stat.on{background:var(--bg)} .stat.on span{color:var(--ink)}

  /* ---------- Quick links ---------- */
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:0;text-align:left;color:#fff;padding:16px;margin:0;min-width:0;
    background:linear-gradient(135deg,#232326,#0b0b0c);position:relative;overflow:hidden}
  .tile::after{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(rgba(244,212,124,.32),transparent 70%)}
  .tile .ico{background:var(--goldgrad);color:var(--black)}
  .tile b{font-size:15px;line-height:1.3}
  .tile b small{display:block;font-weight:500;font-size:12px;color:#bdb6a6;margin-top:2px}
  .tile .arr{position:absolute;right:14px;bottom:12px;color:var(--gold2);font-size:20px;z-index:1}
  .tile:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

  /* ---------- Warehouse ---------- */
  .wh-badge{font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--black);background:var(--goldgrad);width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
  .agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-weight:400;font-size:13.5px;color:var(--muted);cursor:pointer}
  .agree input{width:20px;height:20px;margin:1px 0 0;padding:0;flex-shrink:0;accent-color:var(--gold)}
  .inl{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--golddeep);text-decoration:underline;cursor:pointer}
  .foot{text-align:center;margin:26px 0 6px;font-size:13px}
  .wh-toggle{width:100%;border:0;background:none;padding:0;text-align:left;color:inherit}
  .chev{color:var(--muted);font-size:24px;line-height:1;transition:transform .2s;padding:0 4px}
  .wh-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  [hidden]{display:none!important}
  .btn.light{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--golddeep)}
  .wh{margin-top:12px;border:1.5px dashed #e0cf9f;background:#fffcf3;border-radius:14px;padding:12px 14px}
  .wh-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .wh-k{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .wh-v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
  .wh-v.name{color:var(--golddeep);font-size:15.5px}
  .wh hr{border:0;border-top:1px solid #efe4c6;margin:10px 0}
  .tip{display:flex;gap:8px;margin-top:10px;font-size:13px;color:#6b5420;background:var(--goldbg);border-radius:10px;padding:8px 10px}

  /* ---------- Address ---------- */
  .addr{white-space:pre-line;margin:12px 0 0;padding-left:46px;color:#3d3a34}

  /* ---------- Inputs ---------- */
  label{display:block;font-size:13px;font-weight:600;color:#3d3a34;margin:14px 0 6px}
  input,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fcfbf8;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldbg);background:#fff}
  textarea{min-height:100px;resize:vertical}
  .btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;font-weight:600;font-size:16px;color:var(--gold2);
    background:linear-gradient(180deg,#2a2a2e,#0b0b0c);box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .btn:disabled{opacity:.6}
  .btn.light{background:none;color:var(--muted);box-shadow:none;margin-top:4px;padding:10px}

  .search{position:relative;margin:4px 0 6px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{padding-left:42px;background:#fff;border-color:transparent;box-shadow:var(--shadow)}

  /* ---------- Parcels ---------- */
  .rgroup{padding:0;overflow:hidden}
  .rhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:14px 16px}
  .rico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--black);color:var(--gold2);flex-shrink:0}
  .rt{flex:1;min-width:0;line-height:1.3}
  .rt b{display:block;font-size:16px;letter-spacing:.01em}
  .rt small{font-size:12.5px;color:var(--muted)}
  .rgroup .chev{color:var(--muted);font-size:24px;line-height:1;transition:transform .2s;padding:0 2px}
  .rhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .rhead[aria-expanded="true"]{border-bottom:1px solid var(--line)}
  .rbody{padding:4px 12px 12px;background:#faf8f4}
  .rbody .parcel{box-shadow:none;border:1px solid var(--line);margin:10px 0 0}
  .sec-label{margin:22px 4px 10px;font-size:13px;font-weight:700;color:#3d3a34}
  .parcel{position:relative;padding:16px 16px 14px 20px;overflow:hidden}
  .parcel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#9aa3b0}
  .parcel.ok::before{background:var(--ok)} .parcel.wait::before{background:var(--gold)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .trk{display:flex;align-items:center;gap:6px;min-width:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px}
  .trk span{overflow-wrap:anywhere}
  .copy{border:0;background:var(--bg);color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
  .copy.done{background:var(--okbg);color:var(--ok)}
  .chip{white-space:nowrap;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--gobg);color:var(--go)}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.wait{background:var(--duebg);color:var(--due)}
  .meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
  .pics{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;font-size:13px;font-weight:600;color:var(--golddeep);background:var(--goldbg);padding:7px 12px;border-radius:10px}
  .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .imgs:empty{display:none}
  .imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--line);display:block}

  /* ---------- States ---------- */
  .empty{text-align:center;padding:30px 20px;color:var(--muted)}

</style>

function setLang(l) {
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem('ta_lang', l); } catch (e) {}
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === l));

}

async function api(action, extra = {}) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, idToken, ...extra })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

function toast(s) {
  const el = document.getElementById('toast');
  el.textContent = s; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
  ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function bindCopy(root = app) {
  root.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = async () => {
    if (!(await copyText(btn.dataset.copy))) return;
    toast(t('copied'));
    if (btn.classList.contains('copy')) {
      btn.classList.add('done'); btn.innerHTML = I.check;
      setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = I.copy; }, 1500);
    }
  });
}

function chipClass(s) {
  if (/สำเร็จ|ส่งแล้ว|ถึงแล้ว/.test(s)) return 'ok';
  if (/รอ|ค้าง|ชำระ/.test(s)) return 'wait';
  return '';
}
const isDone = s => chipClass(s) === 'ok';

function linksCard() {
  const tiles = [];
  if (LINKS.schedule) tiles.push(`<button class="card tile" data-url="${esc(LINKS.schedule)}"><div class="ico">${I.cal}</div><b>${t('schedTitle')}<small>${t('schedSub')}</small></b><span class="arr">›</span></button>`);
  if (LINKS.thaiTracking) tiles.push(`<button class="card tile" data-url="${esc(LINKS.thaiTracking)}"><div class="ico">${I_TRUCK}</div><b>${t('thTrackTitle')}<small>${t('thTrackSub')}</small></b><span class="arr">›</span></button>`);
  return tiles.length ? `<div class="links">${tiles.join('')}</div>` : '';
}

function warehouseCard(customerName) {
  const w = WAREHOUSE;
  const recipient = customerName || t('whNameGeneric');
  const all = [recipient, ...w.lines, w.phone].filter(Boolean).join('\n');
  return `
    <div class="card">
      <button class="sec-h wh-toggle" id="whToggle" aria-expanded="${whOpen}" aria-controls="whBody">
        <div class="wh-badge">${esc(w.code)}</div><b>${esc(t('whTitle', w))}<small>${t('whSub')}</small></b><span class="chev">›</span>
      </button>
      <div id="whBody" ${whOpen ? '' : 'hidden'}>
      <div class="wh">
        <div class="wh-row"><div><div class="wh-k">${t('whName')}</div><div class="wh-v name">${esc(recipient)}</div></div>
          ${customerName ? `<button class="copy" data-copy="${esc(recipient)}">${I.copy}</button>` : ''}</div>
        <hr>
        <div class="wh-row"><div><div class="wh-k">${t('whAddr')}</div><div class="wh-v">${esc(w.lines.join('\n'))}${w.phone ? '\n' + esc(w.phone) : ''}</div></div>
          <button class="copy" data-copy="${esc([...w.lines, w.phone].filter(Boolean).join('\n'))}">${I.copy}</button></div>
      </div>
      <div class="tip">${I.info}<span>${esc(customerName ? t('whTipName', customerName) : t('whTipGeneric'))}</span></div>
      ${customerName ? `<button class="btn light" data-copy="${esc(all)}">${I.copy} ${t('whCopy')}</button>` : ''}
      </div>
    </div>`;
}

function addressCard(editing = false, error = '') {
  if (editing) return `
    <div class="card" id="addrCard">
      <div class="sec-h"><div class="ico">${I.pin}</div><b>${t('addrTitle')}</b></div>
      <textarea id="adEdit" style="margin-top:12px">${esc(address)}</textarea>
      ${error ? `<p class="err">${esc(error)}</p>` : ''}
      <button class="btn" id="adSave">${t('save')}</button>
      <button class="btn light" id="adCancel">${t('cancel')}</button>
    </div>`;
  return `
    <div class="card" id="addrCard">
      <div class="sec-h"><div class="ico">${I.pin}</div><b>${t('addrTitle')}</b><button class="link" id="adEditBtn">${t('edit')}</button></div>
      <div class="addr ${address ? '' : 'muted'}">${esc(address || t('addrEmpty'))}</div>
    </div>`;
}

function bindAddress() {
  const card = document.getElementById('addrCard');
  if (!card) return;
  const swap = html => { card.outerHTML = html; bindAddress(); };
  const editBtn = document.getElementById('adEditBtn');
  if (editBtn) return editBtn.onclick = () => swap(addressCard(true));
  document.getElementById('adCancel').onclick = () => swap(addressCard());
  document.getElementById('adSave').onclick = async e => {
    const val = document.getElementById('adEdit').value.trim();
    e.target.disabled = true; e.target.textContent = t('saving');
    try { address = (await api('address', { address: val })).address; swap(addressCard()); toast(t('addrSaved')); }
    catch (err) { swap(addressCard(true, msg(err.message))); document.getElementById('adEdit').value = val; }
  };
}

function bindNew() {
  const nm = document.getElementById('nm'), ph = document.getElementById('ph'), ad = document.getElementById('ad');
  const ok = document.getElementById('ok');
  const sync = () => { form.name = nm.value; form.phone = ph.value; form.addr = ad.value; form.agree = !!(ok && ok.checked); };
  [nm, ph, ad].forEach(el => el.oninput = sync);
  if (ok) ok.onchange = sync;
  document.getElementById('go').onclick = async e => {
    sync();
    const name = form.name.trim(), phone = form.phone.trim(), addr = form.addr.trim();
    if (!name || !phone || !addr) { form.error = 'FILL'; return render(); }
    if (LINKS.policy && !form.agree) { form.error = 'AGREE'; return render(); }
    e.target.disabled = true; e.target.textContent = t('checking');
    try {
      const r = await api('link', { name, phone, address: addr, lineName });
      form.error = '';
      r.state === 'linked' ? load() : (view = 'pending', render());
    } catch (err) { form.error = err.message; render(); }
  };
}

function viewPending() {
  return `
    <div class="card fade empty">
      <div class="ico">${I.check}</div>
      <b style="color:var(--ink)">${t('pendTitle')}</b>
      <p class="muted">${t('pendSub')}</p>
    </div>
    ${warehouseCard('')}
    ${linksCard()}`;
}

function parcelCard(p) {
  const c = chipClass(p.status);
  const when = p.receivedTs ? dTime(p.receivedTs) : p.received;
  return `
    <div class="card parcel ${c}" data-trk="${esc(p.tracking)}">
      <div class="top">
        <div class="trk"><span>${esc(p.tracking)}</span><button class="copy" data-copy="${esc(p.tracking)}" aria-label="copy">${I.copy}</button></div>
        <span class="chip ${c}">${esc(statusText(p.status))}</span>
      </div>
      ${when ? `<div class="meta">${I.calS}${t('received')} ${esc(when)}</div>` : ''}
      ${p.note ? `<div class="meta">${t('note')}: ${esc(p.note)}</div>` : ''}
      ${p.imageCount ? `<button class="pics" data-img>${I.img}${t('pics', p.imageCount)}</button>` : ''}
      <div class="imgs"></div>
    </div>`;
}

function viewLinked() {
  const q = query.toUpperCase().replace(/\s/g, '');
  const list = parcels.filter(p =>
    (filter === 'all' || (filter === 'due' ? !isDone(p.status) : isDone(p.status))) &&
    (!q || p.tracking.toUpperCase().includes(q)));
  const done = parcels.filter(p => isDone(p.status)).length;
  const due = parcels.length - done;

  let html = `
    <div class="card stats">
      <button class="stat ${filter === 'all' ? 'on' : ''}" data-f="all"><b>${parcels.length}</b><span>${t('all')}</span></button>
      <button class="stat due ${filter === 'due' ? 'on' : ''}" data-f="due"><b>${due}</b><span>${t('due')}</span></button>
      <button class="stat done ${filter === 'done' ? 'on' : ''}" data-f="done"><b>${done}</b><span>${t('done')}</span></button>
    </div>
    ${linksCard()}
    ${warehouseCard(me.codeName || me.name)}
    ${addressCard()}
    <div class="search">${I.search}<input id="q" placeholder="${esc(t('search'))}" value="${esc(query)}" inputmode="search"></div>`;

  if (!list.length) html += `<div class="card empty"><div class="ico">${I.box}</div>${parcels.length ? t('noMatch') : t('noParcel')}</div>`;

  const groups = [], byRound = {};               // รวมตามชื่อรอบ แม้แถวในชีตจะสลับกัน
  list.forEach(p => {
    const k = p.round || '';
    if (!byRound[k]) groups.push(byRound[k] = { round: p.round, items: [] });
    byRound[k].items.push(p);
  });
  if (groups.length) html += `<div class="sec-label">${t('rounds')}</div>`;
  groups.forEach(g => {
    const key = g.round || '';
    const open = openRounds.has(key) || !!q;           // ค้นหาอยู่ = กางรอบที่เจอให้อัตโนมัติ
    const due = g.items.filter(p => !isDone(p.status)).length;
    const latest = Math.max(...g.items.map(p => p.receivedTs || 0));
    html += `
      <div class="card rgroup">
        <button class="rhead" data-round="${esc(key)}" aria-expanded="${open}">
          <div class="rico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
          <div class="rt"><b>${esc(roundText(g.round))}</b><small>${t('pcs', g.items.length)}${latest ? ' · ' + esc(fmt(latest, { day: 'numeric', month: 'short', year: '2-digit' })) : ''}</small></div>
          <span class="chip ${due ? 'wait' : 'ok'}">${due ? t('rDue', due) : t('rAllDone')}</span>
          <span class="chev">›</span>
        </button>
        <div class="rbody" ${open ? '' : 'hidden'}>${g.items.map(parcelCard).join('')}</div>
      </div>`;
  });
  return html;
}

function bindLinked() {
  bindAddress();
  app.querySelectorAll('[data-round]').forEach(h => h.onclick = () => {
    const open = h.getAttribute('aria-expanded') !== 'true';
    h.setAttribute('aria-expanded', open);
    h.nextElementSibling.hidden = !open;
    open ? openRounds.add(h.dataset.round) : openRounds.delete(h.dataset.round);
  });
  app.querySelectorAll('[data-f]').forEach(s => s.onclick = () => { filter = s.dataset.f; render(); });
  const qi = document.getElementById('q');
  qi.oninput = () => {
    query = qi.value; render();
    const n = document.getElementById('q'); n.focus(); n.setSelectionRange(query.length, query.length);
  };
  app.querySelectorAll('[data-img]').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('[data-trk]');
    btn.disabled = true; btn.lastChild.textContent = t('loadingPics');
    try {
      const { images } = await api('images', { tracking: card.dataset.trk });
      card.querySelector('.imgs').innerHTML = images.length
        ? images.map(u => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" alt=""></a>`).join('')
        : `<span class="muted">${t('noPics')}</span>`;
      btn.remove();
    } catch (e) { btn.disabled = false; btn.lastChild.textContent = t('picsFail'); }
  });
}

function render() {
  const hello = document.getElementById('hello'), sub = document.getElementById('sub');
  if (view === 'linked') {
    const due = parcels.filter(p => !isDone(p.status)).length;
    hello.textContent = t('helloName', me.name);
    sub.textContent = due ? t('subDue', due) : t('subAllDone');
  } else {
    hello.textContent = t('hello');
    sub.textContent = t('subDefault');
  }
  if (view === 'loading') return;
  if (view === 'error') { app.innerHTML = `<div class="card empty err">${esc(msg(errCode))}</div>`; return; }
  if (view === 'new') { app.innerHTML = viewNew(); bindNew(); }
  if (view === 'pending') app.innerHTML = viewPending();
  if (view === 'linked') { app.innerHTML = viewLinked(); bindLinked(); }
  if (LINKS.policy) app.insertAdjacentHTML('beforeend', `<p class="foot"><button type="button" class="inl" data-url="${esc(LINKS.policy)}">${t('policy')}</button></p>`);
  bindCopy();
  const wt = document.getElementById('whToggle');
  if (wt) wt.onclick = () => {
    whOpen = !whOpen;
    wt.setAttribute('aria-expanded', whOpen);
    document.getElementById('whBody').hidden = !whOpen;
  };
  app.querySelectorAll('[data-url]').forEach(b => b.onclick = () => {
    try { liff.openWindow({ url: b.dataset.url, external: false }); }
    catch (e) { window.open(b.dataset.url, '_blank'); }
  });
}

/* ---------- Start ---------- */

async function load() {
  try {
    me = await api('me');
    view = me.state;
    if (me.settings) {
      WAREHOUSE = me.settings.warehouse || WAREHOUSE;
      LINKS = { schedule: me.settings.scheduleUrl || '', thaiTracking: me.settings.thaiTrackingUrl || '', policy: me.settings.policyUrl || '' };
      document.getElementById('whCode').textContent = WAREHOUSE.code;
    }
    if (view === 'linked') { parcels = me.parcels; address = me.address || ''; }
  } catch (e) { view = 'error'; errCode = e.message; }
  render();
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!lang) {
      let l = ''; try { l = (liff.getAppLanguage ? liff.getAppLanguage() : liff.getLanguage()) || ''; } catch (e) {}
      lang = /^th/i.test(l || navigator.language) ? 'th' : 'en';
    }
    setLang(lang);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    try { lineName = (await liff.getProfile()).displayName; } catch (e) {}
    await load();
  } catch (e) {
    if (!T[lang]) setLang('th');
    view = 'error'; errCode = e.message; render();
  }
})();
</script>
