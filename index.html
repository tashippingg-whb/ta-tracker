<style>
  :root{
    --black:#0b0b0c; --char:#1a1a1d;
    --gold:#c9972b; --gold2:#f4d47c; --golddeep:#9a6f12; --goldbg:#fbf3df;
    --bg:#f3f1ec; --card:#fff; --ink:#18181b; --muted:#6f6b63; --line:#e7e2d8;
    --ok:#178a55; --okbg:#e2f4ea; --go:#3f4a5a; --gobg:#eef0f3; --due:#b26b00; --duebg:#fdf0d8;
    --r:18px; --shadow:0 1px 2px rgba(20,16,8,.05),0 8px 24px rgba(20,16,8,.07);
    --goldgrad:linear-gradient(135deg,#f6dc8c 0%,#d9a93a 45%,#a87a17 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  svg{flex-shrink:0}
  button{font:inherit;cursor:pointer}

  /* ---------- Header ---------- */
  header{position:relative;overflow:hidden;color:#fff;padding:18px 20px 80px;
    background:radial-gradient(90% 120% at 100% 0%,rgba(217,169,58,.28) 0%,transparent 55%),
               radial-gradient(70% 90% at 0% 100%,rgba(217,169,58,.12) 0%,transparent 60%),var(--black)}
  .bar{display:flex;align-items:center;gap:12px}
  .logo{width:52px;height:52px;border-radius:50%;padding:2px;background:var(--goldgrad);box-shadow:0 0 18px rgba(217,169,58,.35)}
  .logo img{width:100%;height:100%;border-radius:50%;display:block}
  .wordmark{flex:1;line-height:1.15}
  .wordmark b{display:block;font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;
    background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wordmark span{font-size:10.5px;letter-spacing:.22em;color:#bdb6a6}
  .lang{display:flex;border:1px solid rgba(244,212,124,.45);border-radius:999px;padding:2px}
  .lang button{border:0;background:none;color:#cfc6b2;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .lang button.on{background:var(--goldgrad);color:var(--black)}
  .hello{margin:22px 0 2px;font-size:24px;font-weight:700;line-height:1.25}
  .sub{margin:0;font-size:14px;color:#bdb6a6}
  .route{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11.5px;font-weight:600;letter-spacing:.1em;color:#d8cfbb}
  .route .path{flex:1;position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px)}
  .route .path svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);color:var(--gold2);filter:drop-shadow(0 0 6px rgba(244,212,124,.8))}
  .route em{font-style:normal;color:var(--gold2)}

  main{position:relative;z-index:2;max-width:560px;margin:-58px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .muted{color:var(--muted);font-size:13.5px}
  .err{color:#c53030;font-size:14px;margin:6px 0 0}

  /* ---------- Section head ---------- */
  .sec-h{display:flex;align-items:center;gap:10px}
  .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--goldbg);color:var(--golddeep)}
  .sec-h b{flex:1;font-size:15px;line-height:1.3}
  .sec-h b small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .link{border:0;background:none;color:var(--golddeep);font-weight:600;font-size:14px;padding:6px 2px}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);padding:6px}
  .stat{border:0;background:none;color:inherit;padding:12px 4px 10px;border-radius:14px;text-align:center;transition:background .15s}
  .stat b{display:block;font-size:26px;line-height:1.1;font-weight:700}
  .stat span{font-size:12.5px;color:var(--muted);font-weight:500}
  .stat.due b{color:var(--due)} .stat.done b{color:var(--ok)}
  .stat.on{background:var(--bg)} .stat.on span{color:var(--ink)}

  /* ---------- Quick links ---------- */
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:0;text-align:left;color:#fff;padding:16px;margin:0;min-width:0;
    background:linear-gradient(135deg,#232326,#0b0b0c);position:relative;overflow:hidden}
  .tile::after{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(rgba(244,212,124,.32),transparent 70%)}
  .tile .ico{background:var(--goldgrad);color:var(--black)}
  .tile b{font-size:15px;line-height:1.3}
  .tile b small{display:block;font-weight:500;font-size:12px;color:#bdb6a6;margin-top:2px}
  .tile .arr{position:absolute;right:14px;bottom:12px;color:var(--gold2);font-size:20px;z-index:1}
  .tile:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

  /* ---------- Warehouse ---------- */
  .wh-badge{font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--black);background:var(--goldgrad);width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
  .agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-weight:400;font-size:13.5px;color:var(--muted);cursor:pointer}
  .agree input{width:20px;height:20px;margin:1px 0 0;padding:0;flex-shrink:0;accent-color:var(--gold)}
  .inl{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--golddeep);text-decoration:underline;cursor:pointer}
  .qbar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;padding:10px 8px}
  .qa{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;color:var(--ink);font-size:12px;font-weight:600;line-height:1.25;padding:6px 2px;border-radius:12px;text-align:center}
  .qa:active{background:var(--bg)}
  .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--black);color:var(--gold2)}
  .qcode{background:var(--goldgrad);color:var(--black);font-family:Cinzel,serif;font-size:15px;font-weight:700}
  .qban{background:#5a1d1d;color:#ffd7d0}
  .ban-note{margin:2px 4px 12px;font-size:13px;color:#8a2d1f;background:#fdecea;border-radius:10px;padding:10px 12px;line-height:1.55}
  .ban{margin:0;padding:0 0 0 4px;list-style:none;counter-reset:b;background:var(--card);border-radius:14px}
  .ban li{counter-increment:b;display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
  .ban li:last-child{border-bottom:0}
  .ban li::before{content:counter(b);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#fdecea;color:#b3261e;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
  .sheet-body.doc{white-space:normal;font-size:14px;line-height:1.75}
  .doc h3{font-size:16px;margin:18px 0 6px;color:var(--ink)} .doc h3:first-child{margin-top:0}
  .doc h4{font-size:15px;margin:16px 0 4px;color:var(--golddeep)} .doc h5{font-size:14px;margin:12px 0 2px}
  .doc p{margin:0 0 8px} .doc i{color:var(--muted);font-style:normal}
  .doc .li{position:relative;padding-left:18px;margin-bottom:6px}
  .doc .li::before{content:"•";position:absolute;left:4px;color:var(--gold)}
  .doc .li.num::before{content:attr(data-n) ".";left:0;font-weight:700;color:var(--golddeep)}
  .dt{display:grid;gap:8px;margin:8px 0 14px}
  .dt-r{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fcfbf8}
  .dt-c{display:flex;gap:10px;justify-content:space-between;padding:3px 0;font-size:13.5px}
  .dt-c span{color:var(--muted);flex-shrink:0;max-width:40%} .dt-c b{text-align:right;font-weight:600}
  .dt-c:first-child b{color:var(--golddeep);font-size:15px}
  .ban-img{width:100%;border-radius:14px;display:block;margin-bottom:12px}
  .ban-h{margin:14px 4px 8px;font-size:14px;color:#8a2d1f}
  .ban + .ban-h{margin-top:16px}
  .sheet-body.plain{white-space:normal;background:var(--bg);padding:12px}
  .sheet-body.plain .card{margin-bottom:0;box-shadow:none}
  .reg{margin:14px 0 0;font-size:13px;text-align:center}
  .pol{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fcfbf8}
  .polbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--goldbg);color:var(--golddeep);font-weight:600;font-size:14px;padding:11px 12px;border-radius:10px;text-align:left}
  .polbtn span{flex:1} .polbtn b{font-size:20px;line-height:1}
  .pol .agree{margin-top:12px}
  .agree.off{opacity:.45;cursor:not-allowed}
  .pol-hint{margin:8px 0 0;font-size:12.5px}
  .sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sheet-h b{font-size:16px}
  .x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:14px;color:var(--muted)}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 18px;white-space:pre-line;font-size:14px;line-height:1.7;color:#3d3a34}
  .sheet-f{padding:12px 18px 16px;border-top:1px solid var(--line);text-align:center}
  .sheet-f .btn{margin-top:6px} .sheet-f p{margin:0;font-size:12.5px}
  .btn:disabled{opacity:.45}
  .sheet.photo{background:transparent;padding:16px;gap:12px;align-items:center}
  .zoom{max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain}
  .imgs img{cursor:zoom-in}
  .foot{text-align:center;margin:26px 0 6px;font-size:13px}
  .wh-toggle{width:100%;border:0;background:none;padding:0;text-align:left;color:inherit}
  .chev{color:var(--muted);font-size:24px;line-height:1;transition:transform .2s;padding:0 4px}
  .wh-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  [hidden]{display:none!important}
  .btn.light{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--golddeep)}
  .wh{margin-top:12px;border:1.5px dashed #e0cf9f;background:#fffcf3;border-radius:14px;padding:12px 14px}
  .wh-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .wh-k{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .wh-v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
  .wh-v.name{color:var(--golddeep);font-size:15.5px}
  .wh hr{border:0;border-top:1px solid #efe4c6;margin:10px 0}
  .tip{display:flex;gap:8px;margin-top:10px;font-size:13px;color:#6b5420;background:var(--goldbg);border-radius:10px;padding:8px 10px}

  /* ---------- Address ---------- */
  .addr{white-space:pre-line;margin:12px 0 0;padding-left:46px;color:#3d3a34}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fcfbf8;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a6d1f 50%),linear-gradient(135deg,#8a6d1f 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  select:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldbg)}
  .ad-note{min-height:64px}
  .ship{margin:10px 0 0;padding-left:46px;font-size:13.5px;color:#3d3a34}
  .ship b{color:var(--golddeep);font-weight:600}
  .ad-h{margin:20px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
  .ad-h b{display:block;font-size:14.5px} .ad-h small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .addr-warn{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:9px 11px;border-radius:10px;background:#fdecea;color:#8a2d1f;font-size:13px}
  .notice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #f3c9c2;background:#fdf1ef;color:#8a2d1f;font:inherit;font-size:14px;font-weight:600}
  .notice span{flex:1} .notice b{font-size:20px;line-height:1}
  .pay{border:1.5px solid #e9b4ab;background:linear-gradient(180deg,#fff6f4,#fdecea)}
  .pay-h{display:flex;align-items:center;gap:10px;color:#8a2d1f}
  .pay-h .ico{background:#8a2d1f;color:#fff}
  .pay-h b{font-size:15.5px} .pay-h small{display:block;font-weight:400;font-size:12.5px;color:#a0493a;margin-top:2px}
  .pay-r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed #efc3bb;font-size:14px}
  .pay-r:first-of-type{margin-top:10px}
  .pay-r b{color:#8a2d1f;white-space:nowrap} .pay-r small{display:block;color:var(--muted);font-size:12.5px}
  .pay-info{white-space:pre-line;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #f3d6d0;font-size:13.5px;position:relative;padding-right:46px}
  .pay-info .copy{position:absolute;top:8px;right:8px}
  .chip.unpaid{background:#fdecea;color:#8a2d1f}

  /* ---------- Inputs ---------- */
  label{display:block;font-size:13px;font-weight:600;color:#3d3a34;margin:14px 0 6px}
  input,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fcfbf8;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldbg);background:#fff}
  textarea{min-height:100px;resize:vertical}
  .btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;font-weight:600;font-size:16px;color:var(--gold2);
    background:linear-gradient(180deg,#2a2a2e,#0b0b0c);box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .btn:disabled{opacity:.6}
  .btn.light{background:none;color:var(--muted);box-shadow:none;margin-top:4px;padding:10px}

  .search{position:relative;margin:4px 0 6px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{padding-left:42px;background:#fff;border-color:transparent;box-shadow:var(--shadow)}

  /* ---------- Parcels ---------- */
  .rgroup{padding:0;overflow:hidden}
  .rhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:14px 16px}
  .rico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--black);color:var(--gold2);flex-shrink:0}
  .rt{flex:1;min-width:0;line-height:1.3}
  .rt b{display:block;font-size:16px;letter-spacing:.01em}
  .rt small{font-size:12.5px;color:var(--muted)}
  .rgroup .chev{color:var(--muted);font-size:24px;line-height:1;transition:transform .2s;padding:0 2px}
  .rhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .rhead[aria-expanded="true"]{border-bottom:1px solid var(--line)}
  .rbody{padding:4px 12px 12px;background:#faf8f4}
  .rbody .parcel{box-shadow:none;border:1px solid var(--line);margin:10px 0 0}
  .sec-label{margin:22px 4px 10px;font-size:13px;font-weight:700;color:#3d3a34}
  .parcel{position:relative;padding:16px 16px 14px 20px;overflow:hidden}
  .parcel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#9aa3b0}
  .parcel.ok::before{background:var(--ok)} .parcel.wait::before{background:var(--gold)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .trk{display:flex;align-items:center;gap:6px;min-width:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px}
  .trk span{overflow-wrap:anywhere}
  .copy{border:0;background:var(--bg);color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
  .copy.done{background:var(--okbg);color:var(--ok)}
  .chip{white-space:nowrap;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--gobg);color:var(--go)}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.wait{background:var(--duebg);color:var(--due)}
  .meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
  .pics{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;font-size:13px;font-weight:600;color:var(--golddeep);background:var(--goldbg);padding:7px 12px;border-radius:10px}
  .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .imgs:empty{display:none}
  .imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--line);display:block}

  /* ---------- States ---------- */
  .empty{text-align:center;padding:30px 20px;color:var(--muted)}
  .empty .ico{margin:0 auto 10px;width:52px;height:52px;border-radius:16px}
  .hero{text-align:center;padding:8px 0 4px}
  .hero img{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px #f1e3b8,0 10px 30px rgba(0,0,0,.18)}
  .sk{height:16px;border-radius:8px;margin:8px 0;background:linear-gradient(90deg,#ece8df 25%,#f7f5f0 50%,#ece8df 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .fade{animation:fd .3s ease}
  @keyframes fd{from{opacity:0;transform:translateY(6px)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--gold2);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:.95}
</style>
</head>

// เรียกหลังบ้าน ถ้าเน็ตสะดุดหรือ Google ตอบช้า จะลองใหม่อัตโนมัติสูงสุด 3 ครั้ง
const RETRYABLE = /lock|timed out|timeout|service|invoked too many|try again|internal error/i;
async function api(action, extra = {}, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    if (i) await new Promise(r => setTimeout(r, 800 * i));
    let j;
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, idToken, ...extra })
      });
      const txt = await r.text();
      try { j = JSON.parse(txt); }
      catch (e) { last = new Error('NETWORK'); last.detail = 'HTTP ' + r.status + ' · ' + txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160); continue; }
    } catch (e) { last = new Error('NETWORK'); last.detail = String(e && e.message || e); continue; }
    if (j.ok) return j;
    last = new Error(j.error); last.detail = j.detail || (T.th.ERR[j.error] ? '' : j.error);
    if (!RETRYABLE.test(j.error)) break;
  }
  throw last;
}

function toast(s) {
  const el = document.getElementById('toast');
  el.textContent = s; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
  ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function bindCopy(root = app) {
  root.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = async () => {
    if (!(await copyText(btn.dataset.copy))) return;
    toast(t('copied'));
    if (btn.classList.contains('copy')) {
      btn.classList.add('done'); btn.innerHTML = I.check;
      setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = I.copy; }, 1500);
    }
  });
}

function chipClass(s) {
  if (/สำเร็จ|ส่งแล้ว|ถึงแล้ว/.test(s)) return 'ok';
  if (/รอ|ค้าง|ชำระ/.test(s)) return 'wait';
  return '';
}
const isDone = s => chipClass(s) === 'ok';

function bindAddress() {
  const card = document.getElementById('addrCard');
  if (!card) return;
  const swap = html => { card.outerHTML = html; bindAddress(); };
  const editBtn = document.getElementById('adEditBtn');
  if (editBtn) return editBtn.onclick = () => swap(addressCard(true));
  document.getElementById('adCancel').onclick = () => swap(addressCard());
  document.getElementById('adSave').onclick = async e => {
    const val = readAddr(card);
    if (!addrFilled(val)) return swap(addressCard(true, t('fillAll'), val));
    e.target.disabled = true; e.target.textContent = t('saving');
    try {
      const r = await api('address', { address: val });
      address = r.address; addrObj = r.addr;
      if (me) { me.address = r.address; me.addr = r.addr; saveCache(); }
      swap(addressCard()); toast(t('addrSaved'));
      if (view === 'linked') { const n = document.getElementById('addrFix'); if (n) n.remove(); }
    } catch (err) { swap(addressCard(true, msg(err.message), val)); }
  };
}

      <label for="ph">${t('fPhone')}</label>
      <input id="ph" type="tel" inputmode="numeric" placeholder="0812345678" value="${esc(form.phone)}" autocomplete="tel">
      <div class="ad-h"><b>${t('adSec')}</b><small>${t('adSecSub')}</small></div>
      ${addrFields(form.ad, 'n_')}
      ${hasPolicy() ? `
        <div class="pol">
          <button type="button" class="polbtn" id="readPol">${I.info}<span>${form.read ? t('polReadAgain') : t('polRead')}</span><b>›</b></button>
          <label class="agree ${form.read ? '' : 'off'}" for="ok"><input type="checkbox" id="ok" ${form.agree ? 'checked' : ''} ${form.read ? '' : 'disabled'}><span>${t('agreeFull', LINKS.policyVersion || '1')}</span></label>
          ${form.read ? '' : `<p class="muted pol-hint">${t('polHint')}</p>`}
        </div>` : ''}
      ${LINKS.register ? `<p class="muted reg">${t('regQ')} <button type="button" class="inl" data-url="${esc(LINKS.register)}">${t('regLink')}</button></p>` : ''}
      ${form.error ? `<p class="err">${esc(form.error === 'FILL' ? t('fillAll') : form.error === 'AGREE' ? t('needAgree') : msg(form.error))}</p>` : ''}
      <button class="btn" id="go">${t('link')}</button>
    </div>
    ${quickBar(false)}`;
}

function bindNew() {
  const nm = document.getElementById('nm'), ph = document.getElementById('ph');
  const ok = document.getElementById('ok');
  const sync = () => { form.name = nm.value; form.phone = ph.value; form.ad = readAddr(app); form.agree = !!(ok && ok.checked); };
  [nm, ph, ...app.querySelectorAll('[data-ak]')].forEach(el => el.oninput = sync);
  // เบอร์ผู้รับ: ใช้เบอร์เดียวกับเบอร์บัญชีถ้ายังไม่ได้กรอก
  ph.onchange = () => { const rp = document.getElementById('n_phone'); if (rp && !rp.value) rp.value = ph.value; sync(); };
  if (ok) ok.onchange = sync;
  const rp = document.getElementById('readPol');
  if (rp) rp.onclick = () => { sync(); openPolicy(); };
  document.getElementById('go').onclick = async e => {
    sync();
    const name = form.name.trim(), phone = form.phone.trim(), addr = form.ad;
    if (!name || !phone || !addrFilled(addr)) { form.error = 'FILL'; return render(); }
    if (hasPolicy() && !form.agree) { form.error = 'AGREE'; return render(); }
    e.target.disabled = true; e.target.textContent = t('checking');
    try {
      const r = await api('link', { name, phone, address: addr, lineName, agree: hasPolicy() ? form.agree : false });
      form.error = '';
      r.state === 'linked' ? load() : (view = 'pending', render());
    } catch (err) { form.error = err.message; render(); }
  };
}

function viewPending() {
  return `
    <div class="card fade empty">
      <div class="ico">${I.check}</div>
      <b style="color:var(--ink)">${t('pendTitle')}</b>
      <p class="muted">${t('pendSub')}</p>
    </div>
    ${quickBar(false)}`;
}

function parcelCard(p) {
  const c = chipClass(p.status);
  const when = p.receivedTs ? dTime(p.receivedTs) : p.received;
  return `
    <div class="card parcel ${c}" data-trk="${esc(p.tracking)}">
      <div class="top">
        <div class="trk"><span>${esc(p.tracking)}</span><button class="copy" data-copy="${esc(p.tracking)}" aria-label="copy">${I.copy}</button></div>
        <span class="chip ${c}">${esc(statusText(p.status))}</span>
      </div>
      ${when ? `<div class="meta">${I.calS}${t('received')} ${esc(when)}</div>` : ''}
      ${p.note ? `<div class="meta">${t('note')}: ${esc(p.note)}</div>` : ''}
      ${p.imageCount ? `<button class="pics" data-img>${I.img}${t('pics', p.imageCount)}</button>` : ''}
      <div class="imgs"></div>
    </div>`;
}

const normRound = r => String(r || '').replace(/เเ/g, 'แ').replace(/\s+/g, '').replace(/^รอบ/, '').toLowerCase();
const isUnpaid = r => unpaid.some(u => normRound(u.round) === normRound(r));
function payCard() {
  if (!unpaid.length) return '';
  return `<div class="card pay">
    <div class="pay-h"><div class="ico">${I.info}</div><b>${t('payTitle')}<small>${t('paySub')}</small></b></div>
    ${unpaid.map(u => `<div class="pay-r"><span>${esc(roundText(u.round))}${u.note ? `<small>${esc(u.note)}</small>` : ''}</span>${u.amount ? `<b>${t('baht', u.amount)}</b>` : ''}</div>`).join('')}
    ${LINKS.payment ? `<div class="pay-info"><b style="display:block;margin-bottom:4px">${t('payInfo')}</b>${esc(LINKS.payment)}<button class="copy" data-copy="${esc(LINKS.payment)}">${I.copy}</button></div>` : ''}
  </div>`;
}

function viewLinked() {
  const q = query.toUpperCase().replace(/\s/g, '');
  const list = parcels.filter(p =>
    (filter === 'all' || (filter === 'due' ? !isDone(p.status) : isDone(p.status))) &&
    (!q || p.tracking.toUpperCase().includes(q)));
  const done = parcels.filter(p => isDone(p.status)).length;
  const due = parcels.length - done;

  let html = `
    ${payCard()}
    ${address && addrObj ? '' : `<button class="card notice" id="addrFix" data-qa="addrfix">⚠️<span>${t('addrOld')}</span><b>›</b></button>`}
    <div class="card stats">
      <button class="stat ${filter === 'all' ? 'on' : ''}" data-f="all"><b>${parcels.length}</b><span>${t('all')}</span></button>
      <button class="stat due ${filter === 'due' ? 'on' : ''}" data-f="due"><b>${due}</b><span>${t('due')}</span></button>
      <button class="stat done ${filter === 'done' ? 'on' : ''}" data-f="done"><b>${done}</b><span>${t('done')}</span></button>
    </div>
    ${quickBar(true)}
    <div class="search">${I.search}<input id="q" placeholder="${esc(t('search'))}" value="${esc(query)}" inputmode="search"></div>`;

  if (!list.length) html += `<div class="card empty"><div class="ico">${I.box}</div>${parcels.length ? t('noMatch') : t('noParcel')}</div>`;

  const groups = [], byRound = {};               // รวมตามชื่อรอบ แม้แถวในชีตจะสลับกัน
  list.forEach(p => {
    const k = p.round || '';
    if (!byRound[k]) groups.push(byRound[k] = { round: p.round, items: [] });
    byRound[k].items.push(p);
  });
  if (groups.length) html += `<div class="sec-label">${t('rounds')}</div>`;
  groups.forEach(g => {
    const key = g.round || '';
    const open = openRounds.has(key) || !!q;           // ค้นหาอยู่ = กางรอบที่เจอให้อัตโนมัติ
    const due = g.items.filter(p => !isDone(p.status)).length;
    const latest = Math.max(...g.items.map(p => p.receivedTs || 0));
    html += `
      <div class="card rgroup">
        <button class="rhead" data-round="${esc(key)}" aria-expanded="${open}">
          <div class="rico"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
          <div class="rt"><b>${esc(roundText(g.round))}</b><small>${t('pcs', g.items.length)}${latest ? ' · ' + esc(fmt(latest, { day: 'numeric', month: 'short', year: '2-digit' })) : ''}</small></div>
          ${isUnpaid(g.round) ? `<span class="chip unpaid">${t('payChip')}</span>` : `<span class="chip ${due ? 'wait' : 'ok'}">${due ? t('rDue', due) : t('rAllDone')}</span>`}
          <span class="chev">›</span>
        </button>
        <div class="rbody" ${open ? '' : 'hidden'}>${g.items.map(parcelCard).join('')}</div>
      </div>`;
  });
  return html;
}

function bindLinked() {
  bindAddress();
  app.querySelectorAll('[data-round]').forEach(h => h.onclick = () => {
    const open = h.getAttribute('aria-expanded') !== 'true';
    h.setAttribute('aria-expanded', open);
    h.nextElementSibling.hidden = !open;
    open ? openRounds.add(h.dataset.round) : openRounds.delete(h.dataset.round);
  });
  app.querySelectorAll('[data-f]').forEach(s => s.onclick = () => { filter = s.dataset.f; render(); });
  const qi = document.getElementById('q');
  qi.oninput = () => {
    query = qi.value; render();
    const n = document.getElementById('q'); n.focus(); n.setSelectionRange(query.length, query.length);
  };
  app.querySelectorAll('[data-img]').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('[data-trk]');
    btn.disabled = true; btn.lastChild.textContent = t('loadingPics');
    try {
      const { images, missing } = await api('images', { tracking: card.dataset.trk });
      card.querySelector('.imgs').innerHTML = images.length
        ? images.map(u => `<img src="${u}" alt="" data-zoom>`).join('')
        : `<span class="muted">${t('noPics')}</span>`;
      card.querySelectorAll('[data-zoom]').forEach(im => im.onclick = () => openZoom(im.src));
      btn.remove();
    } catch (e) { btn.disabled = false; btn.lastChild.textContent = t('picsFail'); }
  });
}

function render() {
  const hello = document.getElementById('hello'), sub = document.getElementById('sub');
  if (view === 'linked') {
    const due = parcels.filter(p => !isDone(p.status)).length;
    hello.textContent = t('helloName', me.name);
    sub.textContent = due ? t('subDue', due) : t('subAllDone');
  } else {
    hello.textContent = t('hello');
    sub.textContent = t('subDefault');
  }
  if (view === 'loading') return;
  if (view === 'error') {
    const why = errDetail || (T.th.ERR[errCode] ? '' : errCode);
    app.innerHTML = `<div class="card empty err">${esc(msg(errCode))}${why ? `<p class="muted" style="margin-top:10px;font-size:11.5px;word-break:break-all">${esc(why)}</p>` : ''}
      <button class="btn" id="retry" style="margin-top:14px">${t('retry')}</button></div>`;
    document.getElementById('retry').onclick = () => { view = 'loading'; app.innerHTML = '<div class="card"><div class="sk"></div><div class="sk" style="width:60%"></div></div>'; load(); };
    return;
  }
  if (view === 'new') { app.innerHTML = viewNew(); bindNew(); }
  if (view === 'pending') app.innerHTML = viewPending();
  if (view === 'linked') { app.innerHTML = viewLinked(); bindLinked(); }
  app.querySelectorAll('[data-pol]').forEach(b => b.onclick = () => openPolicy(true));
  bindCopy();
  app.querySelectorAll('[data-qa="wh"]').forEach(x => x.onclick = openWarehouse);
  app.querySelectorAll('[data-qa="addr"]').forEach(x => x.onclick = () => openAddress());
  app.querySelectorAll('[data-qa="addrfix"]').forEach(x => x.onclick = () => openAddress(true));
  app.querySelectorAll('[data-qa="ban"]').forEach(x => x.onclick = openProhibited);
  app.querySelectorAll('[data-qa="pol"]').forEach(x => x.onclick = () => openPolicy(true));
  app.querySelectorAll('[data-qa="rates"]').forEach(x => x.onclick = openRates);
  const wt = document.getElementById('whToggle');
  if (wt) wt.onclick = () => {
    whOpen = !whOpen;
    wt.setAttribute('aria-expanded', whOpen);
    document.getElementById('whBody').hidden = !whOpen;
  };
  app.querySelectorAll('[data-url]').forEach(b => b.onclick = () => {
    try { liff.openWindow({ url: b.dataset.url, external: false }); }
    catch (e) { window.open(b.dataset.url, '_blank'); }
  });
}

// แปลงข้อความจาก Google Doc เป็นหน้าอ่านง่าย: # หัวข้อ, • รายการ, 1. ลำดับ, | ตาราง
function renderDoc(txt) {
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*(\S.*?\S)\*(?=\s|$)/g, '$1<i>$2</i>');
  let html = '', table = [];
  const flush = () => {
    if (!table.length) return;
    const rows = table.map(r => r.split('|').map(c => c.trim()).filter((c, i, a) => !(i === 0 && c === '') && !(i === a.length - 1 && c === '')));
    const head = rows[0];
    const body = rows.slice(1).filter(r => !r.every(c => /^:?-{2,}:?$/.test(c)));
    html += '<div class="dt">' + body.map(r => '<div class="dt-r">' + r.map((c, i) =>
      `<div class="dt-c"><span>${inl(head[i] || '')}</span><b>${inl(c)}</b></div>`).join('') + '</div>').join('') + '</div>';
    table = [];
  };
  String(txt || '').split(/\r?\n/).forEach(raw => {
    const ln = raw.replace(/^>\s?/, '').trim();
    if (ln.startsWith('|')) { table.push(ln); return; }
    flush();
    if (!ln) return;
    let m;
    if ((m = ln.match(/^(#{1,3})\s*(.+)$/))) html += `<h${m[1].length + 2}>${inl(m[2].replace(/\*\*/g, ''))}</h${m[1].length + 2}>`;
    else if ((m = ln.match(/^(?:[*•-])\s+(.+)$/))) html += `<p class="li">${inl(m[1])}</p>`;
    else if ((m = ln.match(/^(\d+)[.)]\s+(.+)$/))) html += `<p class="li num" data-n="${m[1]}">${inl(m[2])}</p>`;
    else html += `<p>${inl(ln)}</p>`;
  });
  flush();
  return html;
}

  if (!LINKS.ratesText) { try { liff.openWindow({ url: LINKS.rates, external: false }); } catch (e) { window.open(LINKS.rates, '_blank'); } return; }
  const { el, close } = sheet(`<div class="sheet-h"><b>${t('ratesTitle')}</b><button class="x" data-x>✕</button></div>
    <div class="sheet-body doc">${renderDoc(LINKS.ratesText)}</div>
    <div class="sheet-f"><button class="btn" data-x>${t('polClose')}</button></div>`);
  el.querySelectorAll('[data-x]').forEach(x => x.onclick = close);
}
const hasPolicy = () => !!(LINKS.policy || LINKS.policyText);
function sheet(html) {
  const el = document.createElement('div');
  el.className = 'sheet-bg';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  const close = () => { el.remove(); document.body.style.overflow = ''; };
  el.addEventListener('click', e => { if (e.target === el) close(); });
  return { el, close };
}

  const { el, close } = sheet(`
    <div class="sheet-h"><b>${t('policy')}</b><button class="x" data-x aria-label="${t('polClose')}">✕</button></div>
    <div class="sheet-body doc" id="polBody">${renderDoc(LINKS.policyText)}
      ${LINKS.policy ? `<p><button type="button" class="inl" id="polFull">${t('polOpenFull')}</button></p>` : ''}</div>
    <div class="sheet-f">${viewOnly || view !== 'new'
      ? `<button class="btn" data-x>${t('polClose')}</button>`
      : `<p class="muted" id="polWait">${t('polScroll')}</p><button class="btn" id="polOk" disabled>${t('polAccept')}</button>`}</div>`);
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  const full = el.querySelector('#polFull');
  if (full) full.onclick = () => { try { liff.openWindow({ url: LINKS.policy, external: false }); } catch (e) { window.open(LINKS.policy, '_blank'); } };
  const okb = el.querySelector('#polOk'); if (!okb) return;
  const body = el.querySelector('#polBody');
  const check = () => {
    if (body.scrollTop + body.clientHeight >= body.scrollHeight - 24) {
      okb.disabled = false; const w = el.querySelector('#polWait'); if (w) w.remove();
    }
  };
  body.addEventListener('scroll', check); setTimeout(check, 50);
  okb.onclick = () => { close(); form.agree = true; markRead(); };
}
function openZoom(src) {
  const { el, close } = sheet(`<img src="${src}" alt="" class="zoom"><button class="btn" data-x>${t('polClose')}</button>`);
  el.querySelector('.sheet').classList.add('photo');
  el.querySelector('[data-x]').onclick = close;
}

/* ---------- Start ---------- */

// เก็บข้อมูลล่าสุดไว้ในเครื่อง → เปิดครั้งต่อไปแสดงทันที แล้วค่อยอัปเดตข้อมูลใหม่ตามมา
const CACHE_KEY = 'ta_me_v1';
let mySub = '';
function saveCache() {
  try { if (mySub && me && me.state === 'linked') localStorage.setItem(CACHE_KEY, JSON.stringify({ sub: mySub, me })); } catch (e) {}
}
function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
}
function applyMe(m) {
  me = m;
  view = me.state;
    if (me.settings) {
      WAREHOUSE = me.settings.warehouse || WAREHOUSE;
      if (me.settings.deliveryOptions && me.settings.deliveryOptions.length) DELIVERY = me.settings.deliveryOptions;
      applyLinks();
      document.getElementById('whCode').textContent = WAREHOUSE.code;
    }
    if (view === 'linked') { parcels = me.parcels; address = me.address || ''; addrObj = me.addr || null; unpaid = me.unpaid || []; }
}
async function load(background) {
  try {
    applyMe(await api('me'));
    saveCache();
  } catch (e) {
    if (background) return;                       // มีข้อมูลเดิมแสดงอยู่แล้ว ไม่ต้องขึ้น error
    view = 'error'; errCode = e.message; errDetail = e.detail || '';
  }
  if (background && document.querySelector('.sheet-bg')) return;   // ลูกค้ากำลังเปิดหน้าต่างย่อยอยู่ ไม่รีเฟรชทับ
  render();
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!lang) {
      let l = ''; try { l = (liff.getAppLanguage ? liff.getAppLanguage() : liff.getLanguage()) || ''; } catch (e) {}
      lang = /^th/i.test(l || navigator.language) ? 'th' : 'en';
    }
    setLang(lang);
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

    // LINE เก็บ ID token ไว้ในเครื่อง และอาจให้ token ที่หมดอายุแล้ว → ขอ token ใหม่อัตโนมัติ (ครั้งเดียว กันวนลูป)
    const refreshToken = () => {
      let tried = '';
      try { tried = sessionStorage.getItem('ta_relogin') || ''; } catch (e) {}
      if (tried) return false;
      try { sessionStorage.setItem('ta_relogin', '1'); } catch (e) {}
      liff.logout();
      if (liff.isInClient()) location.reload(); else liff.login({ redirectUri: location.href });
      return true;
    };
    const decoded = liff.getDecodedIDToken && liff.getDecodedIDToken();
    if (decoded && decoded.exp && decoded.exp * 1000 < Date.now() + 60000 && refreshToken()) return;

    idToken = liff.getIDToken();
    liff.getProfile().then(p => { lineName = p.displayName; }).catch(() => {});   // ไม่ต้องรอ
    mySub = (decoded && decoded.sub) || '';
    const c = readCache();
    if (c && c.sub && c.sub === mySub && c.me) {
      applyMe(c.me); render();                    // แสดงข้อมูลล่าสุดทันที
      await load(true);                           // แล้วอัปเดตข้อมูลจริงตามมา
    } else {
      await load();
    }
    if (view === 'error' && errCode === 'INVALID_TOKEN' && refreshToken()) return;
    try { if (view !== 'error') sessionStorage.removeItem('ta_relogin'); } catch (e) {}
  } catch (e) {
    if (!T[lang]) setLang('th');
    view = 'error'; errCode = e.message; render();
  }
})();
</script>
